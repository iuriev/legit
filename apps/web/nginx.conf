server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The largest request is a 5 MB PDF in a multipart form.
  client_max_body_size 6m;

  # The API sets its own security headers; the two locations of static files
  # set theirs, because add_header in a location replaces the inherited ones.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    # The API trusts these from this container only (TRUST_PROXY). The client
    # address keys the rate limit; the protocol decides the Secure cookie flag.
    # Both are set here, not appended, so a caller cannot supply its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File names carry a content hash, so they never change.
  location /assets/ {
    # Without "always": a missing file must not be remembered for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri =404;
  }

  # Every other path is a page of the single-page app. The page itself is
  # never cached, so a new build is picked up at once.
  location / {
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri /index.html;
  }
}
